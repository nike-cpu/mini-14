<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>训练室（已停用）· mini-14</title>
<link rel="icon" href="fishmaid-avatar.png?v=3" />
<style>
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#fbf7f3;color:#382c2a;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  }
  .card{
    max-width:520px;margin:24px;background:#fff;border:1px solid #efe0d6;border-radius:20px;
    padding:36px 34px;box-shadow:0 12px 32px rgba(90,50,40,.08);text-align:center;
  }
  .ava{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 24px rgba(209,84,74,.18)}
  h1{font-size:20px;margin:16px 0 8px}
  p{color:#9b8884;font-size:13.5px;line-height:1.9;margin:0 0 8px}
  .tip{background:#fbf1ec;border:1px solid #f2ddd4;border-radius:12px;padding:13px 15px;font-size:13px;color:#7d5e57;margin:16px 0 20px;text-align:left;line-height:1.8}
  a.back{
    display:inline-block;background:linear-gradient(135deg,#d1544a,#e8746a);color:#fff;text-decoration:none;
    padding:10px 22px;border-radius:11px;font-size:13.5px;font-weight:700;box-shadow:0 6px 16px rgba(209,84,74,.25);
  }
</style>
</head>
<body>
  <div class="card">
    <img class="ava" src="fishmaid-avatar.png?v=3" alt="mini-14" />
    <h1>训练室已停用</h1>
    <p>这个功能已经关闭了，后台的小训练服务也不再启动。</p>
    <div class="tip">
      🎨 <b>替代功能：文字颜色</b><br/>
      打开聊天窗口 → 右上角「设置」→ 顶部「🎨 文字颜色」，<br/>
      选一个预设色或自定义颜色，正文颜色立刻改变，下次打开也会记住。
    </div>
    <a class="back" href="index.html">← 回到聊天</a>
  </div>
</body>
</html>
